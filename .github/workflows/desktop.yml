# Fabrica la versión de PC (instalador .exe para Windows).
#  • Cada cambio en la carpeta "desktop": la fabrica y la prueba (se puede bajar desde la pestaña Actions).
#  • Al subir una etiqueta "desktop-vX.Y.Z": además la publica en Releases para que cualquiera la descargue.
name: PC version (Windows)

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install tools
        run: npm ci

      - name: Build the installer
        run: npm run dist

      - name: Test the program (opens the editor and a world)
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:MBW_SMOKE = $smoke
          $env:MBW_USER_DATA = Join-Path $env:RUNNER_TEMP 'userdata'
          $env:MBW_NO_UPDATE_CHECK = '1'
          $world = Resolve-Path '..\dev-maps\Empty World.mbw'
          $p = Start-Process -FilePath 'dist\win-unpacked\MB World Editor.exe' -ArgumentList "`"$world`"" -PassThru
          $t = 0
          while (-not (Test-Path $smoke) -and $t -lt 240) { Start-Sleep -Seconds 2; $t += 2 }
          if (-not $p.HasExited) { Start-Sleep -Seconds 3; if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } }
          if (-not (Test-Path $smoke)) { throw 'The program did not answer' }
          Get-Content $smoke
          $r = Get-Content $smoke | ConvertFrom-Json
          if (-not $r.ok) { throw 'The program opened but the editor or the world did not load' }

      - name: Test the installer (install, open a .mbw with double-click, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'MB World Editor.exe' | Select-Object -First 1
          if (-not $exe) { throw 'The installer did not install the program' }
          Write-Host "Installed in: $($exe.DirectoryName)"
          $assoc = (Get-ItemProperty 'HKCU:\Software\Classes\.mbw' -ErrorAction SilentlyContinue).'(default)'
          Write-Host ".mbw is opened by: $assoc"
          if (-not $assoc) { throw '.mbw files are not linked to the program' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MB World Editor.lnk'
          Write-Host "Desktop shortcut: $(Test-Path $lnk)"
          # doble clic en un .mbw (lo abre Windows con el programa que le toca)
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke2.json'
          $env:MBW_SMOKE = $smoke
          $env:MBW_USER_DATA = Join-Path $env:RUNNER_TEMP 'userdata2'
          $env:MBW_NO_UPDATE_CHECK = '1'
          $world = Join-Path $env:RUNNER_TEMP 'Mundo de prueba.mbw'
          Copy-Item '..\dev-maps\Empty World.mbw' $world
          Start-Process -FilePath $world
          $t = 0
          while (-not (Test-Path $smoke) -and $t -lt 240) { Start-Sleep -Seconds 2; $t += 2 }
          Start-Sleep -Seconds 3
          Get-Process 'MB World Editor' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $smoke)) { throw 'Double-clicking a .mbw did not open the program' }
          Get-Content $smoke
          $r = Get-Content $smoke | ConvertFrom-Json
          if (-not $r.ok) { throw 'The program opened from the .mbw but the world did not load' }
          $un = Get-ChildItem $exe.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          Write-Host "Still installed after uninstall: $(Test-Path $exe.FullName)"

      - uses: actions/upload-artifact@v6
        with:
          name: MB-World-Editor-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish in Releases
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $files --title "MB World Editor for PC ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
